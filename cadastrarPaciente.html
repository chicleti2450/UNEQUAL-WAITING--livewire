<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <title>Cadastrar Novo Paciente</title>
</head>

<body class="bg-primary-subtle d-flex align=items-center justify-content-center vh-100">

    <div class="container d-flex justify-content-center align-items-center">

        <section class="mb-2">
            <div class="card text-center ">
                <div class="card shadow-lg p-2" style="width: 500px; border: radius 60px;">
                    <div class="card-body">
                        <span class="center border">
                            <h2 class="mb-3 ps-2">
                                <i class="bi bi-heart-pulse"></i>
                                <h5 class="card-title fw-bold text-start">Cadastrar Novo Paciente</h5>
                                <p class="text-body-secondary text-start">Apenas a secretaria pode cadastrar pacientes
                                    (mínimo 18 anos)
                                </p>
                            </h2>
                        </span>

                        <div class="mb-3 text-start fw-bold">
                            <label for="formGroupExampleInput" class="form-label">Nome Completo *</label>
                            <input type="text" class="form-control bg-body-secondary" id="formGroupExampleInput"
                                placeholder=" ">
                        </div>

                        <div class="mb-3 text-start fw-bold">
                            <label for="formGroupExampleInput" class="form-label">CPF *</label>
                            <input type="text" class="form-control bg-body-secondary" id="formGroupExampleInput"
                                placeholder="000.000.000-00">
                        </div>

                        <div class="mb-3 text-start fw-bold">
                            <label for="formGroupExampleInput" class="form-label">RG *</label>
                            <input type="text" class="form-control bg-body-secondary" id="formGroupExampleInput"
                                placeholder="000.000.000-00">
                        </div>

                        <div class="mb-3 text-start fw-bold">
                            <label for="formGroupExampleInput" class="form-label">Telefone *</label>
                            <input type="text" class="form-control bg-body-secondary" id="formGroupExampleInput"
                                placeholder="(00) 00000-0000">
                        </div>

                        <div class="mb-3 text-start fw-bold">
                        <label for="nascimento" class="form-label">Data de Nascimento</label>
                        <input type="date" class="form-control bg-body-secondary" id="nascimento" name="nascimento">
                        </div>

                        <div class="mb-3 text-start fw-bold">
                            <label for="formGroupExampleInput2" class="form-label">Endereço Completo *</label>
                            <input type="text" class="form-control bg-body-secondary" id="formGroupExampleInput2"
                                placeholder="Rua, número, bairro, cidade - UF">
                        </div>
                        
                        <button type="submit" class="btn btn-primary input-group mb-3">Entrar</button>

                        <a link rel="https://www.google.com/" href="#">Cadastrar Paciente</a>
                    </div>
                </div>
        </section>
    </div>

</body>

</html>
